[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trady"
version = "0.1.0"
description = "Polymarket Insider Detection Bot"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Vedanth Jadhav"}
]

dependencies = [
    "aiohttp>=3.9.0",
    "pandas>=2.0.0",
    "pyarrow>=14.0.0",
    "typer>=0.9.0",
    "tqdm>=4.66.0",
    "tenacity>=8.2.0",
    "python-dateutil>=2.8.0",
    "rich>=13.7.0",
    "xgboost>=2.0.0",
    "scikit-learn>=1.3.0",
    "scipy>=1.11.0",
    "joblib>=1.3.0",
    "numpy>=1.24.0",
    "textual>=0.47.0",
    "certifi>=2023.0.0",
    "questionary>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
trady = "src.interactive_cli:main"
trady-data = "src.data.cli:main"
trady-analysis = "src.analysis.cli:main"
trady-signals = "src.signals.cli:main"
trady-ml = "src.ml.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
